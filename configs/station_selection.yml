study_period:
  start_date: 2020-01-01
  end_date: 2025-12-31
  time_standard: UTC

observation_source:
  dataset: NOAA/NCEI Global Hourly (ISD)
  network_identification: NWS ASOS equipment roster crosswalked to NCEI ISD identifiers
  late_2025_availability_status: unavailable_in_current_public_access_listing_through_2025-08-28

observation_matching:
  target: HRRR forecast valid UTC hour
  search_window:
    start_minutes_relative_to_target: -10
    end_minutes_relative_to_target: 0
  selection_order:
    - closest_observation_to_target_hour
    - acceptable_ncei_quality_control_status
    - routine_hourly_observation_if_still_tied
  missing_temperature: exclude_forecast_observation_pair
  imputation: false

station_completeness:
  preliminary_screen: NCEI ISD monthly inventory
  final_metric: qualifying_forecast_observation_pairs_over_expected_pairs
  required_annual_coverage: every_study_year
  target_minimum_fraction: 0.90
  final_eligibility: pending_data_screen

spatial_matching:
  method: nearest_HRRR_3km_grid_cell_center
  mapping: fixed_per_station
  interpolation_primary_analysis: false

